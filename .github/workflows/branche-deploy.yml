# À chaque « git push » sur main, reconstruit la branche « deploy » (backend + web + deploy, sans les apps mobiles).
# Le serveur ne clone que cette branche.
name: Branche deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branche-deploy
  cancel-in-progress: false

jobs:
  deploy-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Construire la branche deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show-ref --verify --quiet refs/remotes/origin/deploy && git branch -f deploy origin/deploy
          bash scripts/sync-deploy-branch.sh HEAD

      - name: Envoyer la branche deploy
        run: git push origin deploy
